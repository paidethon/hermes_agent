# =============================================================================
# Zephyr AI Desktop — rclone Template Configuration
# =============================================================================
# 此模板在容器启动时由 entrypoint.sh 处理：
#   1. 从环境变量读取 ONEDRIVE_TOKEN / ONEDRIVE_DRIVE_ID / RCLONE_CRYPT_PASSWORD
#   2. 替换模板中的占位符
#   3. 生成 /mnt/workspace/zephyr/config/rclone.conf
#   4. chmod 600
#
# 安全原则（§4）：
#   - rclone.conf 运行时生成，不写入镜像
#   - 密钥通过环境变量注入
#
# 维护者：海豚-容器工程师（模板），行者-Linux专家（entrypoint 集成）
# =============================================================================

[onedrive]
type = onedrive
token = ${ONEDRIVE_TOKEN}
drive_id = ${ONEDRIVE_DRIVE_ID}
drive_type = personal
region = global
chunk_size = 10M
upload_cutoff = 10M

[crypt]
type = crypt
remote = onedrive:zephyr-backup
filename_encryption = standard
directory_name_encryption = true
password = ${RCLONE_CRYPT_PASSWORD}
password2 = ${RCLONE_CRYPT_PASSWORD2}
