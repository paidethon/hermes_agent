# Keepalive v2: state + health + readiness, not just the platform flag.
#
#   Running + ready            -> no-op
#   Stopped                    -> deploy (retries capped)
#   Running + readiness fails
#     3 probes in a row        -> ONE recovery deploy, guarded by a 4h cooldown
#                                 and a 3-per-24h cap (state via actions/cache)
#   Building / Deploying       -> no-op
#
# The readiness probe is the public /readyz (nine-probe aggregation), so a
# desktop-side failure (the kded5/kwin class of incidents) now triggers the
# same recovery path as a stopped space.
name: Keepalive
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: keepalive
  cancel-in-progress: false
jobs:
  keepalive:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Restore recovery-state cache
        uses: actions/cache/restore@v4
        with:
          path: keepalive-state.json
          key: keepalive-state-not-exists
          restore-keys: |
            keepalive-state-
      - name: Prerequisites
        env:
          MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
          SPACE_ID: ${{ secrets.SPACE_ID }}
        run: |
          if [ -z "${MODELSCOPE_TOKEN:-}" ] || [ -z "${SPACE_ID:-}" ]; then
            echo "::error::MODELSCOPE_TOKEN or SPACE_ID secret is not set"
            exit 1
          fi
      - name: Evaluate state + readiness, recover when allowed
        env:
          MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
          SPACE_ID: ${{ secrets.SPACE_ID }}
        run: python3 scripts/modelscope_keepalive.py --state-file keepalive-state.json
      - name: Save recovery-state cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: keepalive-state.json
          key: keepalive-state-${{ github.run_id }}-${{ github.run_attempt }}
