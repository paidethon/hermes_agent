# =============================================================================
# Zephyr AI Desktop — Nginx Portal Configuration（路由 v2）
# =============================================================================
# 统一入口：0.0.0.0:7860
#
# 路由 v2 变更（2026-08-09，对照 hermes-studio v0.6.39 源码核实后调整）：
#   hermes-studio 前端为根绝对路径硬编码（/api /assets /socket.io /logo.png 等，
#   无 basePath 配置项，仓库无任何子路径部署支持），挂 /hermes/ 子路径必然 404。
#   因此 Studio 改为占据根路径（catch-all），原门户导航页移至 /portal/。
#
#   - /（catch-all）→ Hermes Studio :8648（含 /api /v1 /upload /socket.io /assets）
#   - /portal/      → 静态导航页
#   - /desktop/     → noVNC :6080
#   - /chat/        → Open WebUI :8082
#   - /flow/        → Flowise :8083
#   - /internal/    → 防御性 404（仅 127.0.0.1）
#   - /health       → 健康检查（无鉴权，供平台探测）
#
#   原 /api/ 防御性 404 已移除：该路径现为 Studio 自身 BFF（受 Basic Auth +
#   JWT 登录 + 失败锁定三重保护）；Hermes Gateway API 从未进过路由表，
#   仍然仅容器内 127.0.0.1:8642 loopback 直连。
#
# 合并自：林深-安全合规员 安全加固补充文件 §1.1–§1.4
# =============================================================================

# ---------------------------------------------------------------------------
# 全局安全设置
# ---------------------------------------------------------------------------
server_tokens off;                          # 隐藏 Nginx 版本指纹

client_max_body_size 50m;                   # 限制请求体大小，防大包 DoS

# 限流：每 IP 10 req/s，突发 20
limit_req_zone $binary_remote_addr zone=portal:10m rate=10r/s;

# ---------------------------------------------------------------------------
# Portal Server — :7860
# ---------------------------------------------------------------------------
server {
    listen 7860 default_server;
    listen [::]:7860 default_server;
    server_name _;

    # 安全响应头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # 应用限流
    limit_req zone=portal burst=20 nodelay;

    # -----------------------------------------------------------------------
    # /desktop/ → noVNC → TigerVNC (:6080)
    # Nginx Basic Auth + VNC 密码 = 双因素保护
    # -----------------------------------------------------------------------
    location /desktop/ {
        auth_basic "Desktop Portal";
        auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass http://127.0.0.1:6080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 长连接超时
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # -----------------------------------------------------------------------
    # /portal/ → 静态导航页
    # -----------------------------------------------------------------------
    location /portal/ {
        auth_basic "AI Portal";
        auth_basic_user_file /etc/nginx/.htpasswd;

        alias /var/www/portal/;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # -----------------------------------------------------------------------
    # /chat/ → Open WebUI (:8082)
    # -----------------------------------------------------------------------
    location /chat/ {
        auth_basic "AI Portal";
        auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass http://127.0.0.1:8082/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # -----------------------------------------------------------------------
    # /flow/ → Flowise (:8083) — 默认启用 (ENABLE_FLOWISE=1)
    # 双层认证：此处 Basic Auth（外层）+ Flowise 自身 FLOWISE_USERNAME/PASSWORD（内层）
    # Flowise 默认无认证，必须保留 Basic Auth（林深 §4 高风险要求）
    # -----------------------------------------------------------------------
    location /flow/ {
        auth_basic "AI Portal";
        auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass http://127.0.0.1:8083/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # -----------------------------------------------------------------------
    # §1.4 内部端口防护层（双保险）
    # 即使某服务误绑 0.0.0.0，Nginx 层也拒绝外部直达内部端口
    # -----------------------------------------------------------------------
    location /internal/ {
        allow 127.0.0.1;
        deny all;
        return 404;
    }

    # -----------------------------------------------------------------------
    # 健康检查端点（供 ModelScope 平台探测，无鉴权）
    # §9.5 低风险修复：Content-Type 移到 return 之前
    # -----------------------------------------------------------------------
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # -----------------------------------------------------------------------
    # catch-all / → Hermes Studio (:8648)
    # 必须放最后：Studio 前端资源与 API 均为根绝对路径（/api /v1 /upload
    # /webhook /socket.io /assets /logo.png /manifest.webmanifest），
    # 且 SPA 对任意未知路径回退 index.html（hash 路由）。
    # Socket.IO 长连接需要 Upgrade 转发 + 3600s 超时。
    # 认证：Basic Auth（第一道门）+ Studio JWT 登录（第二道门，
    # 默认 admin/123456，登录失败 10 次锁 1 小时）。
    # -----------------------------------------------------------------------
    location / {
        auth_basic "AI Portal";
        auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass http://127.0.0.1:8648;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
