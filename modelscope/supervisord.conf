# =============================================================================
# Zephyr AI Desktop — Supervisord Configuration
# =============================================================================
# 管理所有进程：Nginx / TigerVNC / noVNC / Hermes Gateway / Hermes Studio /
#               Open WebUI / llama.cpp / (可选: Flowise)
#
# 关键安全原则（方案 §5 §9）：
#   - 所有内部服务显式绑 127.0.0.1（§6.4）
#   - TigerVNC 使用 -PasswordFile + -SecurityTypes VncAuth + -localhost（§3）
#   - Hermes Gateway / Studio / Open WebUI / llama.cpp 以非 root 用户 hermes 运行
#   - Nginx 和 TigerVNC 以 root 运行（需特权端口/系统资源）
#
# 合并自：林深-安全合规员 安全加固补充文件 §3 / §6.4
# 维护者：行者-Linux专家
# =============================================================================

[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor
user=root

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

# ---------------------------------------------------------------------------
# Nginx Portal — 唯一对外端口 0.0.0.0:7860
# ---------------------------------------------------------------------------
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/nginx.log
stderr_logfile=/var/log/supervisor/nginx-err.log
stopsignal=QUIT

# ---------------------------------------------------------------------------
# TigerVNC Server — 绑 127.0.0.1 (§3)
# -PasswordFile 强制认证
# -SecurityTypes VncAuth 仅允许密码认证
# -localhost 确保只绑 127.0.0.1，外部无法直连
# VNC 显示号 :1 → TCP 端口 5901
# ---------------------------------------------------------------------------
[program:vnc]
command=Xvnc :1 -PasswordFile /root/.vnc/passwd -SecurityTypes VncAuth -localhost -geometry 1920x1080 -depth 24
autostart=true
autorestart=true
priority=20
user=root
stdout_logfile=/var/log/supervisor/vnc.log
stderr_logfile=/var/log/supervisor/vnc-err.log

# ---------------------------------------------------------------------------
# noVNC Web Server — 绑 127.0.0.1:6080
# 将 VNC 流量通过 WebSocket 暴露给 Nginx 反代
# ---------------------------------------------------------------------------
[program:novnc]
command=/opt/novnc/utils/novnc_proxy --vnc 127.0.0.1:5901 --listen 127.0.0.1:6080
autostart=true
autorestart=true
priority=30
stdout_logfile=/var/log/supervisor/novnc.log
stderr_logfile=/var/log/supervisor/novnc-err.log

# ---------------------------------------------------------------------------
# Hermes Gateway — 绑 127.0.0.1:8642 (§5 §6.4)
# 以非 root 用户 'hermes' 运行，解决 root 崩溃问题
# 不进 Nginx 路由表，仅内部 loopback 直连
#
# BUG-7 修复（2026-08-09，修 A7 时对照真实仓库 NousResearch/hermes-agent 核实）：
#   ① 原 command=/opt/hermes/gateway 指向的是目录（Python 包）不是可执行文件；
#      真实启动方式是 hermes CLI 子命令 hermes gateway run（官方标注
#      recommended for Docker/WSL/Termux），前台运行适配 supervisord
#   ② api_server 平台默认即 127.0.0.1:8642（api_server.py DEFAULT_HOST/
#      DEFAULT_PORT），无需也不支持 --host/--port 参数
#   ③ HERMES_AUTH_TOKEN 是不存在的变量（真实仓库 grep 无结果）；
#      真实鉴权变量是 API_SERVER_KEY —— 且必须 >=16 位，否则 api_server
#      平台根本不会注册启动（config.py _has_usable_api_server_key）。
#      密钥由 entrypoint.sh setup_hermes_api_key() 注入（源自 HERMES_API_KEY）
# ---------------------------------------------------------------------------
[program:hermes-gateway]
command=hermes gateway run
directory=/opt/hermes
autostart=true
autorestart=true
priority=40
user=hermes
environment=HERMES_HOME="/mnt/workspace/zephyr/hermes",HERMES_ALLOW_ROOT_GATEWAY="0",API_SERVER_KEY="%(ENV_HERMES_API_KEY)s"
stdout_logfile=/var/log/supervisor/hermes-gateway.log
stderr_logfile=/var/log/supervisor/hermes-gateway-err.log
startretries=5
startsecs=3

# ---------------------------------------------------------------------------
# Hermes Studio — 绑 127.0.0.1:8648 (§5 §6.4)
# Web 管理界面，经 Nginx 根路径对外（见 portal.conf 路由 v2 说明）
#
# BUG-8/BUG-9 修复（2026-08-09，对照 EKKOLearnAI/hermes-studio v0.6.39 源码核实）：
#   ① 原 command 引用的 server.js 在仓库中不存在；真实生产入口是
#      node dist/server/index.js（Koa 单进程：静态资源 + API + Socket.IO）。
#      package.json 的 "start"=vite 仅开发模式，不可用于生产。
#   ② 端口/host 由环境变量控制：PORT（默认 8648）/ BIND_HOST（默认 0.0.0.0，
#      必须显式设 127.0.0.1）。CLI 不接受 --host/--port 命令行参数。
#   ③ HERMES_GATEWAY_URL 是失效变量（仅存在于文档注释，代码无读取点）。
#      v0.6.39 架构：studio 不通过 HTTP 连接 gateway——聊天走 Python agent
#      bridge（IPC），消息平台 gateway 由 studio spawn 托管。
#   ④ HERMES_WEB_UI_DISABLE_GATEWAY_AUTOSTART=1：禁止 studio 自行 spawn
#      gateway，避免与 supervisord 管理的 hermes-gateway 争抢同一
#      HERMES_HOME 的 PID 锁（gateway/run.py 单实例锁 + --replace 语义）。
#   ⑤ HERMES_BIN 指向 hermes CLI（studio spawn 子进程/bridge 需要）。
#   登录：首次用 admin/123456（登录页有提示，登录后强制引导改密）。
# ---------------------------------------------------------------------------
[program:hermes-studio]
command=node /opt/hermes-studio/dist/server/index.js
directory=/opt/hermes-studio
autostart=true
autorestart=true
priority=50
user=hermes
environment=NODE_ENV="production",PORT="8648",BIND_HOST="127.0.0.1",HERMES_WEB_UI_HOME="/mnt/workspace/zephyr/hermes-studio",HERMES_WEB_UI_DISABLE_GATEWAY_AUTOSTART="1",HERMES_BIN="/usr/local/bin/hermes",HERMES_HOME="/mnt/workspace/zephyr/hermes"
stdout_logfile=/var/log/supervisor/hermes-studio.log
stderr_logfile=/var/log/supervisor/hermes-studio-err.log
startretries=3
startsecs=8

# ---------------------------------------------------------------------------
# Open WebUI — 绑 127.0.0.1:8082 (§5 §6.4)
# 通用聊天界面，通过 Nginx /chat/ 路由对外
# 以 hermes 用户运行（方案 §10.3）
# 双后端对接（方案 §8.3）：
#   - 本地 llama.cpp (127.0.0.1:8081/v1) — 默认
#   - ModelScope API — 通过 Open WebUI 管理面板配置
# ---------------------------------------------------------------------------
[program:open-webui]
command=open-webui serve --host 127.0.0.1 --port 8082
autostart=true
autorestart=true
priority=65
user=hermes
environment=DATA_DIR="/mnt/workspace/zephyr/open-webui",OPENAI_API_BASE_URL="http://127.0.0.1:8081/v1",OPENAI_API_KEY="%(ENV_LLAMA_CPP_API_KEY)s",OPENWEBUI_DEFAULT_MODEL="qwen3-8b-local"
stdout_logfile=/var/log/supervisor/open-webui.log
stderr_logfile=/var/log/supervisor/open-webui-err.log
startretries=3
startsecs=5

# ---------------------------------------------------------------------------
# llama.cpp Server — 绑 127.0.0.1:8081 (§5 §8.1)
# 本地 GGUF 推理，默认启用 (ENABLE_LLAMA_CPP=1)
# 模型：Qwen3-8B-Q4_K_M (~5GB)
# 以 hermes 用户运行（方案 §10.3）
# 安全：启用 --api-key 认证（§M2 修复），防止容器内未授权调用
# 路径与参数均通过环境变量引用，避免硬编码（§S1 修复建议）
# ---------------------------------------------------------------------------
[program:llama-cpp]
command=/opt/llama.cpp/llama-server --host 127.0.0.1 --port 8081 --model %(ENV_LLAMA_CPP_MODEL_PATH)s --ctx-size %(ENV_LLAMA_CPP_CTX_SIZE)s --threads %(ENV_LLAMA_CPP_THREADS)s --batch-size %(ENV_LLAMA_CPP_BATCH_SIZE)s --n-gpu-layers %(ENV_LLAMA_CPP_NGPU_LAYERS)s --alias %(ENV_LLAMA_CPP_MODEL_ALIAS)s --api-key %(ENV_LLAMA_CPP_API_KEY)s
directory=/opt/llama.cpp
autostart=%(ENV_ENABLE_LLAMA_CPP)s
autorestart=true
priority=60
user=hermes
environment=MODELSCOPE_CACHE="/mnt/workspace/zephyr/models"
stdout_logfile=/var/log/supervisor/llama-cpp.log
stderr_logfile=/var/log/supervisor/llama-cpp-err.log
startretries=3
startsecs=5

# ---------------------------------------------------------------------------
# Flowise — 绑 127.0.0.1:8083 (§5 §10.2)
# 默认启用 (ENABLE_FLOWISE=1，用户已确认)
# 认证：Nginx /flow/ Basic Auth（外层）+ Flowise 自身用户名密码（内层，林深 §4）
# 凭据由 entrypoint.sh setup_flowise_credentials() 注入（Secret > 持久化复用 > 自动生成）
# 数据持久化到 /mnt/workspace/zephyr/flowise（init_persistence 已创建并 chown hermes）
# ---------------------------------------------------------------------------
[program:flowise]
command=/opt/flowise/flowise start --port 8083 --host 127.0.0.1
directory=/opt/flowise
autostart=%(ENV_ENABLE_FLOWISE)s
autorestart=true
priority=80
user=hermes
environment=FLOWISE_USERNAME="%(ENV_FLOWISE_USER)s",FLOWISE_PASSWORD="%(ENV_FLOWISE_PASSWORD)s",PORT="8083",HOST="127.0.0.1",DATABASE_PATH="/mnt/workspace/zephyr/flowise",SECRETKEY_PATH="/mnt/workspace/zephyr/flowise",LOG_PATH="/mnt/workspace/zephyr/flowise/logs",BLOB_STORAGE_PATH="/mnt/workspace/zephyr/flowise/storage",TOOL_FUNCTION_BUILTIN_DEP="crypto,fs",ALLOW_BUILTIN_DEP="false"
stdout_logfile=/var/log/supervisor/flowise.log
stderr_logfile=/var/log/supervisor/flowise-err.log
startretries=3
startsecs=10
