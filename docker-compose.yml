# =============================================================================
# 恢复版架构 — 本地预演 compose
# =============================================================================
# 与生产使用同一个 Dockerfile（CI 构建发布 GHCR，魔搭空间按 digest 拉取同一镜像）。
# 用途：部署前在本地跑通「启动 → /healthz → /readyz → 登录 → 桌面」全链路。
#
#   cp .env.recovery.example .env   # 填入必填值后
#   docker compose config && docker compose up --build
#
# 说明：
#   - PUBLIC_ORIGIN 只是认证 Cookie 的域，本地没有 TLS 终结，浏览器登录需要
#     真实 HTTPS 源；自动化验收（curl + Host 覆盖）不需要。保持与
#     tests/smoke_container.py 一致的 *.test 域名即可。
#   - healthcheck 继承镜像内置 HEALTHCHECK（health.py --once 七探针），
#     不在此重复定义另一套判据。
#   - 数据落在本机 named volume 模拟平台持久盘；镜像内 DATA_ROOT 默认
#     /mnt/workspace/zephyr-v2，不会触碰旧 zephyr 目录。
# =============================================================================

services:
  hermes-desktop:
    build:
      context: .
      dockerfile: Dockerfile
    image: hermes-recovery:local
    container_name: hermes-recovery
    ports:
      - "7860:7860"
    volumes:
      - hermes-data:/mnt/workspace
    environment:
      # 必填：认证与访问（值规则见 .env.recovery.example / recovery/bootstrap.py）
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://zephyr.local.test}
      AUTH_USERNAME: ${AUTH_USERNAME:-zephyr}
      AUTH_PASSWORD: ${AUTH_PASSWORD:?AUTH_PASSWORD is required (16-256 chars)}
      VNC_PASSWORD: ${VNC_PASSWORD:?VNC_PASSWORD is required (8-64 printable ASCII)}
      DESKTOP_PASSWORD: ${DESKTOP_PASSWORD:?DESKTOP_PASSWORD is required (8-256 chars)}
      # 可选：云模型（不配置时桌面就绪但 Agent 无法回答）
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      HERMES_MODEL: ${HERMES_MODEL:-}
      # 桌面与数据
      DATA_ROOT: ${DATA_ROOT:-/mnt/workspace/zephyr-v2}
      DESKTOP_GEOMETRY: ${DESKTOP_GEOMETRY:-1280x800}
      CHROME_NO_SANDBOX: ${CHROME_NO_SANDBOX:-0}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8G
        reservations:
          memory: 2G

volumes:
  hermes-data:
    driver: local
